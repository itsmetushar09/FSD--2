name: Exp16 Fullstack CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  # ---------------- BACKEND TEST ----------------
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exp16/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest || echo "No tests found, skipping"


  # ---------------- FRONTEND TEST ----------------
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exp16/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test || echo "No tests found, skipping"


  # ---------------- CD (DOCKER DEPLOYMENT) ----------------
  deploy:
    needs: [backend-test, frontend-test]   # runs only if tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t exp16-backend ./exp16/backend

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 exp16-backend
          docker ps