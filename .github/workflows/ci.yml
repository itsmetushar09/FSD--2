name: Exp16 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-exp16:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exp16/backend   

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest